[project]
authors = [{ name = "Daniel Ward", email = "danielward27@outlook.com" }]
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "jax>=0.7.0",
    "equinox>=0.11",
    "jaxtyping",
    "tqdm",
    "optax",
    "paramax>=0.0.5",
    "lineax"
]
description = "Easy to use distributions, bijections and normalizing flows in JAX."
keywords = ["jax", "neural-networks", "equinox"]
license = { file = "LICENSE" }
name = "flowjax"
readme = "README.md"
requires-python = ">=3.11"
version = "19.2.1"

[project.urls]
repository = "https://github.com/danielward27/flowjax"
documentation = "https://danielward27.github.io/flowjax/index.html"

[project.optional-dependencies]
dev = [
    # TODO: Remove the pytest<9 pin once the pytest.approx JAX regression is
    # fixed in a released pytest version.
    # https://github.com/pytest-dev/pytest/issues/15284
    "pytest<9",
    "beartype",
    "ruff",
    "sphinx",
    "sphinx-book-theme",
    "sphinx-copybutton",
    # TODO: Remove the <3.17 pin when sphinx-autodoc-typehints no longer
    # executes jaxtyping's TYPE_CHECKING-only _indirection module. 3.17.x
    # triggers a guarded_import warning that fails the -W docs build.
    "sphinx-autodoc-typehints<3.17",
    "nbsphinx",
    "ipython",
    "numpyro>=0.20.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "--jaxtyping-packages=flowjax,beartype.beartype(conf=beartype.BeartypeConf(strategy=beartype.BeartypeStrategy.On))"

[tool.ruff]
include = ["*.py", "*.pyi", "**/pyproject.toml", "*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "B", "D", "COM", "I", "UP", "TRY004", "RET", "PT", "FBT"]
ignore = ["D102", "D105", "D107", "B028", "COM812", "F722"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
"*.ipynb" = ["D"]
"__init__.py" = ["D"]
